apiVersion: v1
kind: Pod
metadata:
  name: swe-rl-gpu
  labels:
    app: swe-rl-gpu
spec:
  restartPolicy: Never
  containers:
    - name: main
      # 【5090 适配】GPU 已从 P4/V100 切换到 RTX 5090（Blackwell, sm_120）。
      # 旧镜像 app-verl0.4-vllm0.8.5（CUDA 12.1 + torch 2.4/2.5）在 sm_120 上会报
      # "no kernel image is available for execution on the device"，必须换 cu128 镜像。
      # verl 从 v0.6.0 起基于 vllm/sglang 发布，vllm011.latest 对应
      # verl0.6-cu128-torch2.8.0-fa2.7.4，CUDA 12.8 + torch 2.8 已覆盖 sm_120 要求。
      # ⚠️ 训练侧仍可先用 HFRollout（不依赖 vLLM 引擎），只要 torch 支持 sm_120 即可；
      #    若后续要切 vLLM 引擎，需节点起来后实测 vLLM 预编译 kernel 是否含 sm_120。
      image: verlai/verl:vllm011.latest
      command: ["sleep", "infinity"]
      envFrom:
        - secretRef:
            name: cloud-creds
      env:
        - name: E2B_VALIDATE_API_KEY
          value: "false"
        - name: AGS_REWARD_TOOL_NAME
          value: "swe-synth-shared-runner"
        - name: HF_HOME
          value: "/workspace/hf_cache"
      resources:
        requests:
          nvidia.com/gpu: 1
          cpu: "3"
          memory: "16Gi"
        limits:
          nvidia.com/gpu: 1
          cpu: "4"
          memory: "19Gi"
      volumeMounts:
        # ⚠️ 这个挂载**不可省略**。容器内 /dev/shm 默认只有 64MB，而 NCCL 初始化
        # 每个 rank 要申请约 31.5MB 共享内存段，一旦上次训练泄漏了 /dev/shm/nccl-*
        # （`pkill -9` 强杀 Ray worker 就会泄漏），新训练启动即报：
        #   ncclSystemError: ... /dev/shm/nccl-XXXXXX (size 33030528),
        #   error: No space left on device (28)
        # 表现为 FSDP 初始化失败 + Hydra 退出，训练零步崩溃。
        # 且 Pod 非 privileged 时 `mount -o remount,size=8G /dev/shm` 报 write-protected，
        # 事后无法补救，只能重建 Pod —— 所以务必在建 Pod 时就带上本挂载。
        # （若用 TKE 控制台手动粘贴精简 YAML，极易漏掉 volumes 段，已实测踩坑。
        #   兜底手段见 scripts/run_grpo_training.sh 里的 NCCL_SHM_DISABLE=1。）
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: swe-rl-llm
spec:
  type: LoadBalancer
  selector:
    app: swe-rl-gpu
  ports:
    - name: llm
      port: 8000
      targetPort: 8000
